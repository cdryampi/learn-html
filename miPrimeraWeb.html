<!--
  Este esqueleto básico de una página web HTML incluye las siguientes partes:

  <!DOCTYPE html> - Declara el tipo de documento como HTML5.
  <html lang="en"> - Define el idioma del contenido de la página como inglés.
  <head> - Contiene metadatos sobre el documento.
    <meta charset="UTF-8"> - Especifica la codificación de caracteres como UTF-8.
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> - Configura la ventana gráfica para que sea responsiva en dispositivos móviles.
    <title>Document</title> - Define el título de la página que aparece en la pestaña del navegador.
  <body> - Contiene el contenido visible de la página web.
</body>
</html>
-->
